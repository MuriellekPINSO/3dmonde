# Publishes the site to GitHub Pages on every push to main:
# https://muriellekpinso.github.io/Benin3D/
# To do once in the repository settings:
#   Settings → Pages → Source: "GitHub Actions"
#   Settings → Secrets and variables → Actions → New repository secret:
#     VITE_GOOGLE_MAPS_KEY = the Google Maps key (optional; restrict it to
#     https://muriellekpinso.github.io/* in the Google Cloud console)
name: Publier le site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_GOOGLE_MAPS_KEY: ${{ secrets.VITE_GOOGLE_MAPS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
